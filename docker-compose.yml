# ─────────────────────────────────────────────────────────────────
# TaskManager — Full Stack Docker Compose (Windows)
#
# Services:
#   postgres  — PostgreSQL 16 database
#   app       — Spring Boot TaskManager API
#   frontend  — React app (built with Node, served by Nginx)
#   nginx     — Reverse proxy with TLS (HTTPS on port 443)
#   jenkins   — CI/CD server (http://localhost:8090)
#
# First-time setup:
#   1. bash scripts/setup-certs.sh
#   2. docker compose up -d --build
#
# Access:
#   React UI  → https://localhost
#   API       → https://localhost/api/...
#   Jenkins   → http://localhost:8090
# ─────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Spring Boot App
  # Not exposed directly — Nginx proxies /api/ to it.
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmanager
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: taskpassword
      JWT_SECRET: 40776da6500c96f1a17ea620c6e52f06ac2ea071c940a62789df75427a9cbe64
    networks:
      - backend

  # ─────────────────────────────────────────────
  # React Frontend
  # Dockerfile.frontend does a multi-stage build:
  #   Stage 1 (node:18) — npm install + npm run build
  #   Stage 2 (nginx)   — serves the /build folder
  # Nginx proxies to this container for all non-API requests.
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: taskmanager-frontend
    restart: unless-stopped
    networks:
      - backend

  # ─────────────────────────────────────────────
  # Nginx — TLS + Routing
  #   /api/* and /auth/* → Spring Boot (app:8080)
  #   everything else    → React frontend (frontend:80)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskmanager-nginx
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - backend

  # ─────────────────────────────────────────────
  # Jenkins CI/CD
  # ─────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: taskmanager-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

volumes:
  postgres_data:
  jenkins_data:

networks:
  backend:
    driver: bridge
