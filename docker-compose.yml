version: '3.8'

# ─────────────────────────────────────────────────────────────────
# TaskManager — Full Stack Docker Compose (Windows)
#
# Services:
#   postgres  — PostgreSQL 16 database
#   app       — Spring Boot TaskManager API (built from Dockerfile)
#   nginx     — Reverse proxy with TLS (HTTPS on port 443)
#   jenkins   — CI/CD server (http://localhost:8090)
#
# First-time setup:
#   1. Run: .\scripts\setup-certs.ps1
#   2. Run: docker compose up -d
#
# Access:
#   API  → https://localhost
#   Jenkins → http://localhost:8090
# ─────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword    # Change in production!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Spring Boot App
  # Built from your Dockerfile (multi-stage build).
  # Not exposed directly — traffic goes via Nginx.
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Matches spring.datasource.url=${SPRING_DATASOURCE_URL} in application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmanager
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: taskpassword

      # Matches @Value("${app.jwtSecret}") in JwtTokenProvider.java
      # Use a long random string — min 64 chars for HS512
      JWT_SECRET: change-this-to-a-long-random-secret-min-64-chars-for-hs512!!
    networks:
      - backend
    # No ports exposed — Nginx is the only entry point

  # ─────────────────────────────────────────────
  # Nginx — TLS Termination
  # Listens on 443 (HTTPS) and 80 (→ redirects).
  # Forwards decrypted traffic to app:8080 internally.
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: taskmanager-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"      # HTTP → redirected to HTTPS
      - "443:443"    # HTTPS (self-signed cert for local dev)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - backend

  # ─────────────────────────────────────────────
  # Jenkins CI/CD
  # Runs Jenkins with Docker socket mounted so it
  # can build Docker images from within the pipeline.
  # Access: http://localhost:8090
  # ─────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: taskmanager-jenkins
    restart: unless-stopped
    privileged: true    # Needed for Docker-in-Docker
    user: root          # Needed to access Docker socket
    ports:
      - "8090:8080"     # Jenkins UI
      - "50000:50000"   # Jenkins agent communication port
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount host Docker socket — lets Jenkins build Docker images
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

volumes:
  postgres_data:
  jenkins_data:

networks:
  backend:
    driver: bridge
