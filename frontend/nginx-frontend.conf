server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router fix — serve index.html for all routes
    # so /dashboard, /tasks etc. don't return 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Vite's hashed static assets for 1 year
    # Vite puts them in /assets/ with content hashes in filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
