# ─────────────────────────────────────────────────────────────────
# application.properties
# Place this in: src/main/resources/application.properties
#
# Environment variables are injected by docker-compose.yml.
# Defaults (after the colon) are used for local dev without Docker.
# ─────────────────────────────────────────────────────────────────

# Server
server.port=8080

# PostgreSQL — overridden by docker-compose environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — matches @Value("${app.jwtSecret}") in JwtTokenProvider.java
app.jwtSecret=${JWT_SECRET:DefaultLocalDevSecretKey1234567890!!}
app.jwtExpirationInMs=86400000
